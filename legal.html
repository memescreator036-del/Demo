<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0B0B0B"><title>Privacy &amp; Terms | Verde &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--gold:#D4AF6A;--gold2:#F1DDA8;--text:#F2EDE2;--muted:#A8A093;--line:rgba(212,175,106,.28);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--sans)}
a{color:inherit;text-decoration:none}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.05;margin:0 0 .4em}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:68px;max-width:1140px;margin:0 auto;padding:0 22px}
.brand{font:600 1.4rem var(--serif);letter-spacing:.14em;color:var(--gold2)}
.nav a{color:var(--muted);font-size:.9rem}
.legal{padding:70px 0 90px}
.legal h1{font-size:clamp(2.8rem,7vw,4.4rem);text-transform:uppercase;letter-spacing:.05em}
.legal h2{font-size:2rem;margin-top:44px;color:var(--gold2)}
.legal p{color:var(--text);white-space:pre-line}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.85rem;text-align:center}
footer a{color:var(--gold)}
</style></head>
<body>
<header><div class="nav"><a class="brand" href="index.html" data-bind="general.name">Verde &amp; Gold</a><a href="index.html">← Back to home</a></div></header>
<main class="wrap legal">
  <h1 class="gold">Privacy policy</h1>
  <p data-bind="legal.privacy">We collect only the details you send through our forms, and use them only to serve you.</p>
  <h2 id="terms">Terms of use</h2>
  <p data-bind="legal.terms">Menu items, prices and opening hours may change without notice.</p>
</main>
<footer><div class="wrap"><p style="margin:0">© 2026 <span data-bind="general.name">Verde &amp; Gold</span> · <a href="index.html">Home</a></p></div></footer>
<script src="config.js"></script>
<script>
const API = window.API_URL;
const get = (o, p) => p.split(".").reduce((a, k) => a?.[k], o) ?? "";
fetch(API + "/content").then(r => { if (!r.ok) throw 0; return r.json(); }).then(c => {
  document.querySelectorAll("[data-bind]").forEach(el => el.textContent = get(c, el.dataset.bind));
}).catch(() => {});
</script>
</body></html>
