<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0B0B0B"><title>Gallery | Verde &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--card:#1A1A1A;--gold:#D4AF6A;--gold2:#F1DDA8;--text:#F2EDE2;--muted:#A8A093;--line:rgba(212,175,106,.28);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding-bottom:84px}
a{color:inherit;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;margin:0}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1140px;margin:0 auto;padding:0 22px}
.eyebrow{font:700 .72rem var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(11,11,11,.92);backdrop-filter:blur(8px)}
.nav{display:flex;justify-content:space-between;align-items:center;height:68px;max-width:1140px;margin:0 auto;padding:0 22px}
.brand{font:600 1.4rem var(--serif);letter-spacing:.14em;color:var(--gold2)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font:600 .8rem var(--sans);letter-spacing:.12em;text-transform:uppercase}
.nav ul a{color:var(--text);opacity:.85}.nav ul a[aria-current="page"]{color:var(--gold2);opacity:1}
.intro{padding:70px 0 36px;text-align:center}
.intro h1{font-size:clamp(3rem,8vw,5.2rem);text-transform:uppercase;letter-spacing:.05em}
.gal{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);padding-bottom:70px}
@media(min-width:900px){.gal{grid-template-columns:repeat(3,1fr)}}
figure{margin:0;border:1px solid var(--line);background:var(--card);overflow:hidden}
.tile,figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tile{background:radial-gradient(circle at 50% 40%,#3a2e1a,#141414 70%)}
figcaption{padding:12px 14px;color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.85rem;text-align:center}
.dock{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,20,20,.94);border:1px solid var(--line);padding:8px 4px;z-index:30}
.dock a{display:grid;justify-items:center;gap:2px;font:600 .66rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.dock a[aria-current="page"]{color:var(--gold2)}.dock .i{font-size:1.15rem}
@media(min-width:880px){.dock{display:none}body{padding-bottom:0}}
@media(max-width:879px){.nav ul{display:none}}
</style></head>
<body>
<header><div class="nav">
  <a class="brand" href="index.html">VERDE &amp; GOLD</a>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="menu.html">Menu</a></li>
    <li><a href="visit.html">Reservations</a></li>
    <li><a href="gallery.html" aria-current="page">Gallery</a></li>
    <li><a href="checkout.html">Order Online</a></li>
  </ul>
</div></header>
<main>
<section class="intro"><div class="wrap">
  <p class="eyebrow">Gallery</p>
  <h1 class="gold">Inside Verde &amp; Gold</h1>
</div></section>
<div class="wrap"><div class="gal" id="gal"><p class="empty">Loading…</p></div></div>
</main>
<footer><div class="wrap"><p style="margin:0">© 2026 Verde &amp; Gold · <a href="account.html">My account</a> · href="legal.html">Privacy &amp; Terms</a></p></div></footer>
<nav class="dock" aria-label="Quick">
  <a href="index.html"><span class="i">⌂</span>Home</a>
  <a href="menu.html"><span class="i">☕</span>Menu</a>
  <a href="checkout.html"><span class="i">🛒</span>Order</a>
  <a href="visit.html"><span class="i">📍</span>Visit</a>
</nav>
<script>
const API = window.API_URL;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch(API + "/content").then(r => { if (!r.ok) throw 0; return r.json(); }).then(c => {
  const items = c.gallery || [];
  document.getElementById("gal").innerHTML = items.length ? items.map(g => `
    <figure>${g.src
      ? `<img src="${esc(g.src)}" alt="${esc(g.caption)}" loading="lazy">`
      : `<div class="tile" role="img" aria-label="${esc(g.caption)} (placeholder)"></div>`}
      <figcaption>${esc(g.caption)}</figcaption></figure>`).join("")
    : `<p class="empty">Photos coming soon.</p>`;
}).catch(() => {
  document.getElementById("gal").innerHTML = `<p class="empty">We cannot load the gallery right now.</p>`;
});
</script>
<script src="config.js"></script>
</body></html>
