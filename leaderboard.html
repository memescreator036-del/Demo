<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0B0B0B"><title>Loyalty leaderboard | Verde &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--card:#1A1A1A;--gold:#D4AF6A;--gold2:#F1DDA8;--text:#F2EDE2;--muted:#A8A093;--line:rgba(212,175,106,.28);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans);padding-bottom:84px}
a{color:inherit;text-decoration:none}
h1{font-family:var(--serif);font-weight:600;margin:0;line-height:1.05}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(11,11,11,.92);backdrop-filter:blur(8px)}
.nav{display:flex;justify-content:space-between;align-items:center;height:68px;max-width:1140px;margin:0 auto;padding:0 22px}
.brand{font:600 1.4rem var(--serif);letter-spacing:.14em;color:var(--gold2)}
.nav a{color:var(--muted);font-size:.9rem}
.intro{padding:60px 0 28px;text-align:center}
.intro h1{font-size:clamp(2.8rem,7vw,4.6rem);text-transform:uppercase;letter-spacing:.05em}
.intro p{color:var(--muted);max-width:52ch;margin:14px auto 0}
.board{border:1px solid var(--line);background:var(--card)}
.r{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.rank{font:700 1.6rem var(--serif);color:var(--gold2);text-align:center}
.r:nth-child(1) .rank,.r:nth-child(2) .rank,.r:nth-child(3) .rank{color:var(--gold)}
.name{font-weight:600}
.pts{font-weight:700;color:var(--gold2);white-space:nowrap}
.pts small{color:var(--muted);font-weight:400}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.how{margin:26px 0 0;color:var(--muted);font-size:.92rem;text-align:center}
.how a{color:var(--gold)}
.dock{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(20,20,20,.94);border:1px solid var(--line);padding:8px 4px;z-index:30}
.dock a{display:grid;justify-items:center;gap:2px;font:600 .66rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.dock .i{font-size:1.15rem}
@media(min-width:880px){.dock{display:none}body{padding-bottom:0}}
</style></head>
<body>
<header><div class="nav"><a class="brand" href="index.html">VERDE &amp; GOLD</a><a href="checkout.html">Order online</a></div></header>
<main class="wrap">
  <section class="intro">
    <h1 class="gold">Loyalty leaderboard</h1>
    <p>Earn 1 point for every AED you spend on paid orders. Tick "show my name" at checkout to appear here.</p>
  </section>
  <div class="board" id="board"><p class="empty">Loading…</p></div>
  <p class="how">Points update once an order is paid. <a href="checkout.html">Order now</a></p>
</main>
<nav class="dock" aria-label="Quick">
  <a href="index.html"><span class="i">⌂</span>Home</a>
  <a href="menu.html"><span class="i">☕</span>Menu</a>
  <a href="checkout.html"><span class="i">🛒</span>Order</a>
  <a href="visit.html"><span class="i">📍</span>Visit</a>
</nav>
<script>
const API = window.API_URL;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch(API + "/leaderboard").then(r => { if (!r.ok) throw 0; return r.json(); }).then(rows => {
  document.getElementById("board").innerHTML = rows.length
    ? rows.map((r, i) => `<div class="r"><span class="rank">${i + 1}</span><span class="name">${esc(r.name)}</span><span class="pts">${r.points} <small>pts</small></span></div>`).join("")
    : `<p class="empty">No one is on the board yet. Be the first to order.</p>`;
}).catch(() => { document.getElementById("board").innerHTML = `<p class="empty">We cannot load the leaderboard right now.</p>`; });
</script>
<script src="config.js"></script>
</body></html>
