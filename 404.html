<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0B0B0B"><title>Page not found | Verde &amp; Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--gold:#D4AF6A;--gold2:#F1DDA8;--text:#F2EDE2;--muted:#A8A093;--line:rgba(212,175,106,.28);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,rgba(212,175,106,.16),transparent 60%),var(--bg);color:var(--text);font:16px/1.6 var(--sans);text-align:center;padding:24px}
h1{font:600 clamp(3rem,9vw,5.5rem)/1 var(--serif);margin:0 0 .3em;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);margin:0 0 28px}
a.btn{display:inline-flex;padding:14px 28px;font:700 .85rem var(--sans);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:#0B0B0B;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:2px;text-decoration:none}
</style></head>
<body>
<main>
  <h1>Page not found</h1>
  <p>The page you are looking for has moved or does not exist.</p>
  <a class="btn" href="index.html">Back to the café</a>
</main>
</body></html>
